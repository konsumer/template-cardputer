<html>
	<head>
		<title>Cardputer</title>
		<style>
			body {
			  margin: 0;
			  height: 100vh;
			  display: grid;
			  place-items: center;
			  background: black;
			  overflow: hidden;
			}
			canvas {
			  --ratio: 16 / 9;
			  aspect-ratio: var(--ratio);
			  width: min(100vw, calc(100vh * (16 / 9)));
			  height: min(100vh, calc(100vw / (16 / 9)));
			  display: block;
			}
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>
	</body>
	<script type="module">
		import loadFW from './index.mjs'
		const canvas = document.getElementById('canvas');
		const m = await loadFW({ canvas })

		// You can use web APIs to test things

		m.loraOut = bytes => console.log('LoRa sent:', bytes)

		// Simulate incoming LoRa bytes
		m.loraInject(new TextEncoder().encode("Hello from web."))

		// fake the number of  satellites seen
		m.satelliteCount = 5

		// Set a GPS fix
		m.gpsSet(51.5074, -0.1278)

		// this fixes emscripten's jenky canvas-size stuff
		const observer = new ResizeObserver(() => {
			window.dispatchEvent(new Event('resize'));
		});
		observer.observe(canvas);
	</script>
</html>
